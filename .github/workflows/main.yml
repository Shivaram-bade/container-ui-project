name: CI-CD

on:
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      #################################################
      # Backend
      #################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      # - name: Run Backend Tests
      #   run: |
      #     cd backend
      #     pytest

      #################################################
      # Frontend
      #################################################

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      #################################################
      # Docker Build
      #################################################

      - name: Build Images
        run: |
          docker compose up --build -d  
