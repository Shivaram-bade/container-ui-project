services:
  redis:
    image: redis:7-alpine
    container_name: vitel-redis
    restart: always
    volumes:
      - /opt/vitel/redis:/data
    networks:
      - vitel-network

  registry:
    image: registry:3
    container_name: vitel-registry
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - /opt/vitel/registry:/var/lib/registry
    networks:
      - vitel-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: container-ui-project-backend:latest
    container_name: vitel-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      VITEL_REGISTRY_INTERNAL_URL: http://registry:5000
      VITEL_REGISTRY_PUSH_HOST: localhost:5000
      VITEL_AGENT_REGISTRY_REPOSITORY: vitel-agent
      VITEL_AGENT_REGISTRY_TAG: v1
      VITEL_AGENT_SOURCE_IMAGE: container-ui-project-backend:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/db.sqlite3:/app/db.sqlite3
      - /home:/home:ro
      - /root:/root:ro
    depends_on:
      - redis
      - registry
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; connection = socket.create_connection(('127.0.0.1', 8000), 2); connection.close()"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - vitel-network
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vitel-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vitel-network
  
networks:
  vitel-network:
    name: vitel-network
    driver: bridge
